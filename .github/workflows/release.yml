# The full regression suite, run once per release rather than on every
# push and pull request.
#
# go.yml covers correctness and lint on every commit — build, vet, gofmt,
# lint, go test -race. Everything below used to run there too, on every
# push and PR, and got expensive and occasionally flaky (the 32-bit
# toolchain install "takes longer than everything else in this job put
# together, and on a bad day apt stalls outright" — see the comment that
# used to sit above that step in go.yml's history): the ILP32
# player/board/mail/house layout checks and the shop-price check (both
# need a 32-bit C build to compare against), the C-vs-Go world-parity
# check (needs a full C build), the license check, two doc-coverage
# checks, a container build, and the play regression suite (test/play,
# a real server on examples/mini driven over a socket). All real, none
# of them cheap, none of them needing an answer on every single commit
# — a release needing an answer on all of them at once is exactly the
# point at which "slow but thorough" is worth more than "fast".
#
# Once that passes, two things get published: the GitHub release itself,
# and the container image, to ghcr.io/gerrowadat/disgracelands for
# linux/amd64 and linux/arm64. Neither needs a secret configured —
# GITHUB_TOKEN covers both — and neither needs the repository to be
# public; see the `image` job for what that does mean.
#
# Nothing is published until the suite above it has passed, and that
# includes the tag. scripts/release.sh dispatches this workflow with
# publish=true and waits; full-suite runs; only then do publish (tag,
# then GitHub release) and image (ghcr.io) run, both `needs:`-gated on
# it. It used to be the other way round -- release.sh tagged and pushed,
# and the tag push triggered this workflow -- which meant a failed
# release left a real vX.Y.Z tag pointing at a commit that had just been
# proved not to release. The release and the image were already gated;
# the tag was not, and a tag is the one part of a release that other
# people fetch and that you cannot quietly take back.
#
# The tag-push trigger is still here, so an already-tagged commit can be
# re-verified and released by hand (`git push origin v1.2.3`), and so a
# tag pushed by any other route still gets the full suite run against it.
# In that direction the tag necessarily exists first; publish notices and
# skips creating it.
#
# workflow_dispatch without publish=true runs the suite and stops --
# for testing this workflow without cutting a release.
name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. v1.2.3), or something throwaway like v0.0.0-test when only exercising this workflow'
        required: false
        default: 'v0.0.0-manual'
      publish:
        description: 'Tag the commit, create the GitHub release and push the image -- if and only if the full suite passes. Leave off to run the suite alone.'
        type: boolean
        required: false
        default: false
      commit:
        description: 'The commit this release was cut from. If set, the suite refuses to run against anything else -- guards against main moving between release.sh dispatching and the runner checking out.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  full-suite:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Fail before the expensive steps, not after them, on the two
      # things that would make the whole run meaningless: releasing a
      # commit nobody asked for, or releasing under a version that is not
      # one.
      - name: Determine the version being released
        id: version
        # Through the environment rather than interpolated into the
        # script: workflow_dispatch inputs are attacker-controlled as far
        # as this shell is concerned, even if only someone with write
        # access can set them.
        env:
          RAW_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          WANT_COMMIT: ${{ inputs.commit }}
          # Both comparisons on purpose: the UI sends a real boolean for a
          # `type: boolean` input, but `gh workflow run` sends every input
          # as a string, and GitHub's `==` casts across types by number --
          # so `true` and `'true'` each match exactly one of these and
          # neither matches both. Relying on truthiness instead would let
          # the string `'false'` publish a release.
          PUBLISHING: ${{ inputs.publish == true || inputs.publish == 'true' || github.event_name == 'push' }}
        run: |
          set -eu
          v="$RAW_VERSION"
          want="$WANT_COMMIT"
          if [ -n "$want" ] && [ "$want" != "$GITHUB_SHA" ]; then
            echo "asked to release $want, but this run checked out $GITHUB_SHA."
            echo "main moved between release.sh dispatching and this run starting;"
            echo "nothing has been tagged or published. Re-run scripts/release.sh."
            exit 1
          fi
          # Anchored, and a regex rather than a `case` glob: `v[0-9]*.`
          # matches a digit followed by anything at all, so the default
          # workflow_dispatch version `v0.0.0-manual` sails straight
          # through one. Strict vX.Y.Z, matching the tag filter this
          # workflow triggers on, which takes no prerelease suffix either
          # -- and matching what docker/metadata-action's type=semver will
          # accept in the image job.
          if [ "$PUBLISHING" = "true" ] &&
             ! printf '%s' "$v" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "'$v' is not a vX.Y.Z version; refusing to publish it"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Releasing $v from $GITHUB_SHA"

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          check-latest: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      # Every release runs the 32-bit checks in full, unconditionally —
      # unlike go.yml's old path-filtered version of this step, a release
      # is exactly the point where "probably didn't touch the layout code"
      # is not good enough.
      - name: Install 32-bit toolchain
        timeout-minutes: 5
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib

      # The C tree's configure generates conf.h, which the layout and
      # fixture programs include.
      - name: Configure the C tree
        run: |
          cd reference/moderncserver
          CFLAGS="-std=gnu89 -fcommon -w" CC=gcc ./configure >/dev/null

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Test
        run: go test -race -count=1 ./...

      # A skipped test is not a passing test. These verify the things that
      # cannot be verified by reading the code — the layout the real
      # player data is in, and a hand-written implementation of a cipher —
      # and skip silently where their toolchain is missing. Every one of
      # these greps a package path recursively (`/...`): see go.yml's git
      # history ("main was red for five merges before anything noticed")
      # for why that is not incidental.
      - name: The 32-bit codec checks must not have skipped
        run: |
          go test -count=1 -v ./internal/persist/player/... > out.txt 2>&1 || { cat out.txt; exit 1; }
          if grep -q -- "--- SKIP.*ilp32" out.txt; then
            echo "the ilp32 checks skipped; they must run for a release:"
            grep -A2 -- "--- SKIP" out.txt
            exit 1
          fi
          grep -c -- "--- PASS.*ilp32" out.txt

      - name: The 32-bit board layout check must not have skipped
        run: |
          go test -count=1 -v ./internal/persist/boards/... > boards.txt 2>&1 || { cat boards.txt; exit 1; }
          if grep -q -- "--- SKIP" boards.txt; then
            echo "the 32-bit board layout check skipped; it must run for a release:"
            grep -A2 -- "--- SKIP" boards.txt
            exit 1
          fi
          grep -- "struct members against the 32-bit C" boards.txt

      - name: The 32-bit mail layout check must not have skipped
        run: |
          go test -count=1 -v ./internal/persist/mail/... > mail.txt 2>&1 || { cat mail.txt; exit 1; }
          if grep -q -- "--- SKIP" mail.txt; then
            echo "the 32-bit mail layout check skipped; it must run for a release:"
            grep -A2 -- "--- SKIP" mail.txt
            exit 1
          fi
          grep -- "mail block values against the 32-bit C" mail.txt

      - name: The 32-bit house layout check must not have skipped
        run: |
          go test -count=1 -v ./internal/persist/houses/... > houses.txt 2>&1 || { cat houses.txt; exit 1; }
          if grep -q -- "--- SKIP" houses.txt; then
            echo "the 32-bit house layout check skipped; it must run for a release:"
            grep -A2 -- "--- SKIP" houses.txt
            exit 1
          fi
          grep -- "struct members against the 32-bit C" houses.txt

      - name: The 32-bit shop price check must not have skipped
        run: |
          go test -count=1 -v -run TestShopPricesMatchA32BitBuildOfTheC ./internal/game/ > shop.txt 2>&1 || { cat shop.txt; exit 1; }
          if grep -q -- "--- SKIP" shop.txt; then
            echo "the 32-bit shop price check skipped; it must run for a release:"
            grep -A2 -- "--- SKIP" shop.txt
            exit 1
          fi
          grep -- "price pairs against the 32-bit C" shop.txt

      - name: The libcrypt comparison must not have skipped
        run: |
          go test -count=1 -v ./internal/auth/... > crypt.txt 2>&1 || { cat crypt.txt; exit 1; }
          if grep -q -- "--- SKIP.*TestAgainstSystemCrypt" crypt.txt; then
            echo "the libcrypt comparison skipped; it must run for a release:"
            grep -B2 -A4 -- "--- SKIP" crypt.txt
            exit 1
          fi
          grep -- "matched the system libcrypt" crypt.txt

      - name: Phase 0 acceptance - dlmud --help lists the full option set
        run: |
          go run ./cmd/dlmud --help > help.txt 2>&1 || true
          for opt in lib-dir player-format world-format listen-telnet listen-telnets \
                     listen-ws tls-cert pulse-interval log-format metrics-addr \
                     allow-legacy-passwords; do
            grep -q -- "-$opt" help.txt || { echo "missing --$opt in --help"; exit 1; }
          done
          grep -q 'DL_LIB_DIR' help.txt || { echo "--help does not document env vars"; exit 1; }

      # The play regression suite: a real dlmud, booted on examples/mini,
      # driven over a real socket by a client that types what a player
      # types. This is the only thing in the tree that runs the boot
      # sequence at all -- reading the world off disk, resetting the
      # zones into it, attaching specials by vnum, loading text/ -- and
      # the only thing that sends the server a real SIGTERM and then
      # looks at what it saved. `go test -race` above covers none of it:
      # internal/server builds its world in Go and wires the server up
      # field by field, which is what makes those tests fast and what
      # makes them blind to a world that no longer loads.
      #
      # -race is passed to the test binary, and test/play then builds the
      # child server with it too (test/play/race_on_test.go): the world
      # goroutine lives in the child, so instrumenting only the driver
      # would watch the half that has no concurrency in it.
      - name: The play regression suite
        run: go test -tags=play -race -count=1 -timeout 30m ./test/play/...

      - name: Lint the world files
        run: go run ./cmd/dlctl world lint --world-dir=examples/stock/binary/world

      - name: docs/configuration.md covers every flag
        run: |
          go run ./cmd/dlmud --help 2>&1 \
            | sed -n 's/^  -\([a-z][a-z0-9-]*\).*/\1/p' \
            | sort -u > flags.txt
          missing=0
          while read -r flag; do
            [ "${#flag}" -le 1 ] && continue
            grep -q -- "--$flag" docs/configuration.md || {
              echo "docs/configuration.md does not mention --$flag"; missing=1; }
          done < flags.txt
          exit $missing

      - name: World parity - the Go and C loaders must agree
        run: ./scripts/world-parity.sh

      - name: License compliance
        run: ./scripts/license-check.sh

      # examples/stock/yaml/ and examples/mini/yaml/ are generated
      # (`dlctl lib import`) from examples/*/binary/, checked in rather
      # than built on demand, same reasoning data/world's own tracked
      # files have (docs/developer.md: "the world is source"). A release
      # is where drift between the two gets caught: regenerate both fresh
      # and diff against what is checked in. scripts/release.sh already
      # does this regeneration locally before dispatching, so a difference
      # here means the workflow was triggered without running it, not that the
      # examples are actually stale — either way, the release should not
      # continue on a mismatch it did not expect.
      - name: Example worlds must match dlctl lib import's output
        run: |
          set -e
          for pair in stock mini; do
            rm -rf "/tmp/regen-$pair"
            go run ./cmd/dlctl lib import \
              --from-dir="examples/$pair/binary" --to-dir="/tmp/regen-$pair" >/dev/null
            if ! diff -rq "examples/$pair/yaml" "/tmp/regen-$pair"; then
              echo "examples/$pair/yaml does not match a fresh dlctl lib import;"
              echo "run scripts/release.sh, which regenerates and commits this before dispatching this workflow."
              exit 1
            fi
          done
          echo "both example yaml worlds match their binary source exactly"

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: build/Dockerfile
          push: false
          load: true
          tags: disgracelands:release
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}

      - name: Image runs and reports its version
        run: |
          got=$(docker run --rm --entrypoint /usr/local/bin/dlctl disgracelands:release version)
          echo "$got"
          echo "$got" | grep -q -- "${{ steps.version.outputs.version }}"

  # `needs: full-suite` is the whole gate. A red suite means this job
  # never starts, so there is no tag, no release and no notes -- the
  # commit is just a commit that failed its release, and the next attempt
  # can reuse the same version number. Nothing here undoes anything,
  # because nothing was done.
  publish:
    needs: full-suite
    if: github.event_name == 'push' || inputs.publish == true || inputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # An annotated tag, as `git tag -a` makes -- release.sh used to
      # create this itself before the suite ran, and `gh release create
      # --target` would only leave a lightweight one behind.
      #
      # On the tag-push path the tag already exists and is what triggered
      # the run, so there is nothing to create; asserting it points where
      # this run thinks it does is still worth the two lines.
      - name: Tag the release
        env:
          VERSION: ${{ needs.full-suite.outputs.version }}
        run: |
          set -eu
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            at=$(git rev-list -n1 "$VERSION")
            [ "$at" = "$GITHUB_SHA" ] || {
              echo "$VERSION already exists and points at $at, not $GITHUB_SHA"; exit 1; }
            echo "$VERSION already tags this commit; nothing to create"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION" "$GITHUB_SHA"
          git push origin "$VERSION"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.full-suite.outputs.version }}
        run: |
          gh release create "$VERSION" --title "$VERSION" --generate-notes

  # The container image, published to GitHub's own registry under the same
  # account as the repository: ghcr.io/gerrowadat/disgracelands.
  #
  # full-suite above has already built this image once for the runner's own
  # architecture and checked that it starts and reports the version being
  # released. This job builds it again, for two architectures, and pushes it;
  # the duplicated build is a couple of minutes once per release, which is
  # cheaper than making the smoke test depend on a registry push having
  # already happened.
  #
  # Same `if` as `publish`: a workflow_dispatch run without publish set
  # exists to test this workflow, and a test run must not overwrite a
  # published tag. It is also what stops `act` (which runs jobs locally as
  # workflow_dispatch, and cannot set the input) from trying to log in to
  # ghcr.io.
  #
  # `needs` names publish as well as full-suite, so the image is pushed
  # only after the tag exists. Ordering rather than gating -- full-suite
  # is what actually decides whether anything gets published -- but a
  # published image whose version tag is not in the repository is a
  # confusing thing to leave behind if the tag push itself fails.
  #
  # The registry needs no secret of its own. GITHUB_TOKEN can write packages
  # owned by the same account as the repository, which is why `packages:
  # write` below is the entire configuration -- and why none of this requires
  # the repository to be public. A package published from a private repository
  # is created private, inheriting the repository's visibility, and can be
  # made public on its own later from the package's settings page without the
  # repository following it.
  image:
    needs: [full-suite, publish]
    if: github.event_name == 'push' || inputs.publish == true || inputs.publish == 'true'
    runs-on: ubuntu-latest
    # Not inherited from the top-level `permissions:` block: naming any
    # permission there sets every unnamed one to none, so contents: read has
    # to be repeated here alongside the one this job actually needs.
    permissions:
      contents: read
      packages: write
    steps:
      # No `ref:`. On the tag-push path this checks out the tag; on the
      # dispatch path it checks out main, which full-suite's version step
      # has already asserted is the commit being released.
      - uses: actions/checkout@v7

      - name: Tags and labels for the image
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # v1.2.3 publishes 1.2.3, 1.2 and latest. No major-only tag: while
          # this is 0.x that would be `0`, which promises rather more than it
          # can keep. `latest` is not listed because the default flavor
          # (latest=auto) already applies it to any non-prerelease semver tag.
          #
          # The labels matter as much as the tags: metadata-action sets
          # org.opencontainers.image.source from the repository, and that
          # label is what links the package to this repo in the GitHub UI --
          # inheriting its permissions, and showing its README on the package
          # page. Without it the package is an orphan nobody can trace back.
          #
          # `value=` on both, rather than letting type=semver read the
          # version out of github.ref: a release is normally cut by
          # dispatching this workflow against main, where github.ref is
          # refs/heads/main and semver patterns match nothing at all --
          # which is not a build failure, it is an empty tag list and a
          # push of nothing. The version the suite agreed on is the one
          # thing here that is right on both trigger paths.
          tags: |
            type=semver,pattern={{version}},value=${{ needs.full-suite.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.full-suite.outputs.version }}

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No setup-qemu-action, deliberately. The arm64 image is cross-compiled
      # by the Go toolchain running natively on the amd64 runner (see
      # build/Dockerfile's --platform=$BUILDPLATFORM comment), and nothing in
      # either image is executed during the build, so there is no foreign
      # binary for QEMU to run.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: build/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.full-suite.outputs.version }}
            COMMIT=${{ github.sha }}

      - name: Say what was published
        run: |
          echo "Pushed:"
          echo "${{ steps.meta.outputs.tags }}"
