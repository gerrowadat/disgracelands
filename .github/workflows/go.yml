# CI for the Go port. The C tree has its own build (BUILDING.md) and is not
# covered here; see docs/proposals/go-port-plan.md §2 for why both exist.
name: go

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          check-latest: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      # -race is not optional here. The port keeps the C server's single
      # game goroutine (docs/proposals/go-port-plan.md §3.1), and the whole safety
      # argument for that design rests on nothing else touching world state.
      - name: Test
        run: go test -race -count=1 ./...

      - name: Phase 0 acceptance - dlmud --help lists the full option set
        run: |
          go run ./cmd/dlmud --help > help.txt 2>&1 || true
          for opt in lib-dir player-format world-format listen-telnet listen-telnets \
                     listen-ws tls-cert pulse-interval log-format metrics-addr \
                     allow-legacy-passwords; do
            grep -q -- "-$opt" help.txt || { echo "missing --$opt in --help"; exit 1; }
          done
          grep -q 'DL_LIB_DIR' help.txt || { echo "--help does not document env vars"; exit 1; }

      # docs/configuration.md is the operator-facing copy of the flag set, and
      # a settings reference that silently drops a flag is worse than none.
      # This cannot check the prose is accurate, only that nothing is missing.
      # The world files are data, and data rots: an exit to a deleted room or
      # a reset command for a mob that no longer exists is invisible until a
      # player walks into it. Linting in CI catches that at the commit that
      # causes it. Errors fail the build; warnings do not, because the
      # shipped world has had several since long before this repo existed.
      - name: Lint the world files
        run: go run ./cmd/dlctl world lint --world-dir=lib/world

      - name: docs/configuration.md covers every flag
        run: |
          go run ./cmd/dlmud --help 2>&1 \
            | sed -n 's/^  -\([a-z][a-z0-9-]*\).*/\1/p' \
            | sort -u > flags.txt
          missing=0
          while read -r flag; do
            # Single-letter names are the C-compatibility aliases, documented
            # as a group rather than one row each.
            [ "${#flag}" -le 1 ] && continue
            grep -q -- "--$flag" docs/configuration.md || {
              echo "docs/configuration.md does not mention --$flag"; missing=1; }
          done < flags.txt
          exit $missing

  # The acceptance criterion for Phase 1: both servers load the world and must
  # hold the same thing afterwards. It runs here rather than in the Go test
  # job because it needs the C tree built, which needs a C toolchain and about
  # a minute.
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'

      - name: World parity - the Go and C loaders must agree
        run: ./scripts/world-parity.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
      - uses: golangci/golangci-lint-action@v9
        with:
          # Pinned, not "latest": .golangci.yml is a v2-schema config, and a
          # v1 binary rejects it outright rather than degrading. The action
          # major version and the tool major version have to agree.
          version: v2.12.2

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: build/Dockerfile
          push: false
          load: true
          tags: disgracelands:ci
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}

      - name: Image runs and reports its version
        run: docker run --rm --entrypoint /usr/local/bin/dlctl disgracelands:ci version
