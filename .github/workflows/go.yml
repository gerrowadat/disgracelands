# Day-to-day CI for the Go port: correctness and lint, nothing else.
#
# This used to also run the 32-bit layout/price checks, the C-vs-Go world
# parity check, the license check, a container build and three doc-coverage
# checks, on every push and pull request. All of that moved to
# release.yml, which runs the same things (plus a version bump and a
# release) but only when a release is actually being cut — see that file's
# own header for why. What is left here answers exactly one question:
# "does this compile, pass its own tests, and meet the lint bar" — the
# thing every single commit needs answered fast, not the thing only a
# release needs answered thoroughly.
#
# One piece came back, on 2026-08-24: the license *notice* check
# (`license-check.sh --notices`, one grep, no C build). It is the only
# part of that suite a newly added file can fail, so it goes wrong on
# ordinary PRs rather than on release-shaped changes, and it had already
# let one through. The step's own comment has the history. The rest of
# license-check.sh stays release-only, and so does everything else in the
# list above — do not read this as the split being reversible piecemeal.
#
# The C tree has its own build (BUILDING.md) and is not covered here; see
# docs/design/go-port-plan.md §2 for why both exist.
name: go

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Now that this workflow is the answer rather than a confirmation of a local
# `act` run (CLAUDE.md, "CI"), the queue in front of it matters. A branch
# that gets three pushes while its first run is still going had three runs
# in flight and only ever cared about the last, which on a repo developed
# from a dozen worktrees at once is how everyone else's PR ends up waiting
# behind runs nobody is reading.
#
# `cancel-in-progress` is scoped to pull requests on purpose. On a push to
# main, two merges landing close together would otherwise leave the first
# commit with a cancelled run and no answer at all — and main is exactly
# where an unverified commit must not sit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          check-latest: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      # -race is not optional here. The port keeps the C server's single
      # game goroutine (docs/design/go-port-plan.md §3.1), and the whole
      # safety argument for that design rests on nothing else touching
      # world state.
      #
      # This runs without the 32-bit toolchain, so the four tests that
      # need it (the player/board/mail/house layout checks, the shop-price
      # check) skip here exactly as they would on any contributor's own
      # 64-bit machine — correct, not a gap: release.yml is where they run
      # for real and where a silent skip is caught rather than allowed.
      - name: Test
        run: go test -race -count=1 ./...

      # Only check 3 of the five, via --notices: that every file written
      # for this project carries its license notice. The other four need a
      # C tree or a baseline diff and stay in release.yml with the rest of
      # the release-only suite.
      #
      # This one is back here because the release-only arrangement has now
      # failed once in the way CLAUDE.md predicted it might. The split on
      # 2026-08-23 reasoned the check "almost never trips and releases are
      # frequent enough that it does not sit long either way", with a note
      # to move it back if that stopped holding. #164 then merged green
      # with scripts/act-guard.sh missing its notice, and the next release
      # attempt (v0.1.0) was what found it.
      #
      # Note the asymmetry that makes this one worth the seconds and the
      # other four not: a *new file* fails it, so it goes wrong exactly
      # when someone adds something — which is every PR — rather than when
      # someone edits LICENSE or the credits, which is almost never. It
      # costs a grep over files git already lists.
      - name: Every file carries its license notice
        run: ./scripts/license-check.sh --notices

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
      - uses: golangci/golangci-lint-action@v9
        with:
          # Pinned, not "latest": .golangci.yml is a v2-schema config, and a
          # v1 binary rejects it outright rather than degrading. The action
          # major version and the tool major version have to agree.
          version: v2.12.2
