# Local development stack. Run from the repository root:
#   docker compose -f build/docker-compose.yml up --build
#
# It boots the whole game -- Phases 0-5 are done -- on the stock CircleMUD
# world this repository ships. See docs/design/go-port-plan.md §10 for
# what is and is not built.

services:
  dlmud:
    build:
      context: ..
      dockerfile: build/Dockerfile
      args:
        VERSION: dev
    # Plaintext telnet only, because a local dev stack has no certificate.
    # Anything reachable by anyone else needs --listen-telnets and a real cert;
    # see docs/design/go-port-plan.md §7.
    command:
      - --lib-dir=/data
      - --listen-telnet=:4000
      - --listen-telnets=
      - --metrics-addr=:9090
      - --log-format=json
    # The image's own user is uid 65532 (distroless `nonroot`), which is right
    # for a deployment mounting a volume it owns and wrong for a bind mount of
    # a directory in your checkout: the server needs to *write* that directory
    # -- pfiles/, plrobjs/, house/, etc/players -- and 65532 owns none of it.
    # Without this the server boots, serves and reads the world fine, and then
    # the first character creation fails with "mkdir /data/pfiles: permission
    # denied", which is a confusing way to find out. Running as the owner of
    # the bind mount fixes it and is still not root.
    #
    # 1000:1000 is the first login account on every ordinary Linux install, so
    # the default is right for most people. It is deliberately not spelled
    # ${UID}: bash makes UID a readonly shell variable and does not export it,
    # so `UID=$(id -u) docker compose ...` fails outright with "UID: readonly
    # variable" rather than doing anything useful. If you are not 1000:
    #   DL_UID=$(id -u) DL_GID=$(id -g) make compose-up
    user: "${DL_UID:-1000}:${DL_GID:-1000}"
    ports:
      - "4000:4000"   # telnet
      - "9090:9090"   # metrics, healthz, readyz
    volumes:
      # The default --lib-dir, so the container sees the same world and player
      # files both servers do outside it -- the C server reaches this same
      # directory through its own reference/moderncserver/lib symlink. The
      # image ships no world of its own, so without a mount here the server
      # has nothing to load at all.
      #
      # The player data written back into it (players/, state/) is
      # gitignored, the same as when the server is run directly against
      # this directory.
      - ../examples/stock/yaml:/data
    # docker stop sends SIGTERM, which the server handles by saving and
    # shutting down cleanly. Give it room to finish.
    stop_grace_period: 45s
    # unless-stopped restarts the server whatever it exited with, which is
    # what a development compose file wants. It also means `shutdown die`
    # typed in the game comes straight back: the exit code that says "stay
    # down" (0, against 2 for `shutdown reboot`) is only read by
    # `restart: on-failure`. See docs/operations.md, "Exit codes".
    restart: unless-stopped
    healthcheck:
      # distroless has no shell and no curl, so there is nothing in the image
      # that can call /readyz. This runs a binary from the image instead, which
      # proves the container is up and executing and nothing about whether the
      # game is serving. A real deployment should point an external check at
      # /readyz on --metrics-addr; see docs/operations.md, "Health and
      # readiness".
      test: ["CMD", "/usr/local/bin/dlctl", "version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
