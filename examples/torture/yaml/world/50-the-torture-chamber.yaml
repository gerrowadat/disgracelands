schema: dl/world@1
zone:
  vnum: 50
  name: The Torture Chamber
  range:
  - 5000
  - 5099
  lifespan: 30
  reset: always
rooms:
- vnum: 5000
  name: The Antechamber of Every Flag
  sector: inside
  flags:
  - dark
  - death
  - no_mob
  - indoors
  - peaceful
  - soundproof
  - no_track
  - no_magic
  - tunnel
  - private
  - godroom
  - house
  - house_crash
  - atrium
  - olc
  - good_regen
  - can_quit
  - pkill
  flags_raw: 4294475776
  desc: |2
       Every room flag a CircleMUD bitvector_t can hold is set on this room
    at once. The field below is 'abcdefghijklmnopqrstuvwxyzABCDEF' - bits 0
    through 31, which is as wide as an i386 `long` ever was. Anything from
    'G' on would be `1 << 32` in an `int`, which is undefined behaviour in
    the C loader rather than a bigger number, so this is the widest field
    that is hostile instead of simply broken.
       Bits nothing has a name for come back through `flags_raw`, which is
    the escape hatch the yaml format has for exactly this.
  exits:
    north:
      to: 5001
      desc: |
            North, to the room whose description is not ASCII.
      key: -1
- vnum: 5001
  name: Caf’ de l’Encodage…
  sector: city
  desc: |2
       This description is CP1252, not UTF-8, and every byte in it that is
    not ASCII is one an archived world file really contains: ’ is the
    curly apostrophe in data/world/wld/90.wld, “ and ” the curly
    quotes, – and — the en and em dashes, … an ellipsis, and é
    è ü ñ the accented letters a builder typed on a machine that
    was not this one.
       © 2001. ½ a loaf. 30° to starboard.
  exits:
    north:
      to: 5002
      desc: |
            North, past the café, to the room that ends in silence.
      key: -1
    south:
      to: 5000
      desc: |
            Back to the Antechamber.
      key: -1
  extra_descs:
  - keywords:
    - caf’
    - sign
    desc: "   The sign says “Café”, in the encoding it was painted in.\n"
- vnum: 5002
  name: The Room That Ends In Silence
  sector: field
  desc: "   This description ends with a deliberately blank line before its\nclosing tilde. fread_string appends CRLF for every line that does not\ncontain a tilde, so the loaded string ends with two of them, and a\nYAML\nliteral block cannot carry that back: goccy's re-print right-trims\nevery trailing newline off the node regardless of the chomping\nindicator. The yaml writer quotes and escapes it instead.\n\n"
  exits:
    north:
      to: 5003
      desc: |
            North, to the room with a carriage return in it.
      key: -1
    south:
      to: 5001
      desc: |
            Back to the café.
      key: -1
- vnum: 5003
  name: The Room With A Bare Carriage Return
  sector: inside
  desc: "   The line after this one ends with a literal CR before its newline.\nrawLine strips only the '\\n', so the CR survives into the string and\nfread_string then appends its own CRLF after it:\r\n   That is a bare carriage return once CRLF pairs are folded to LF, and\na bare CR is unrepresentable in a YAML block scalar at all - the spec\nfolds CR, CRLF and LF alike on decode. obj/0.obj's bug object in the\nreal archive has fifteen of them in a row.\n"
  exits:
    north:
      to: 5004
      desc: |
            North, to the room with trailing spaces.
      key: -1
    south:
      to: 5002
      desc: |
            Back to the room that ends in silence.
      key: -1
- vnum: 5004
  name: The Room With Trailing Spaces
  sector: inside
  desc: "   The final line of this description carries its own tilde, so\nfread_string returns without appending CRLF, and it carries trailing\nspaces before that tilde. A literal block drops them; the writer\nquotes the string instead.   "
  exits:
    north:
      to: 5005
      desc: |
            North, to the room with a hash in it.
      key: -1
    south:
      to: 5003
      desc: |
            Back to the room with a carriage return in it.
      key: -1
- vnum: 5005
  name: The Room With A Hash In It
  sector: inside
  desc: |2
       The next line begins with a '#'. count_hash_records counts those to
    size its arrays, and it counts this one, so the loader allocates room
    for a record that is not there:
    #5005 is prose, not a record header, whatever the record counter says.
       A lone dollar sign is content too, and so is a hash that is not in
    the first column: only a tilde ends a string, and only a hash in
    column one starts a record. $
  exits:
    north:
      to: 5006
      desc: |
            North, to the gallery.
      key: -1
    south:
      to: 5004
      desc: |
            Back to the room with trailing spaces.
      key: -1
- vnum: 5006
  name: The Gallery of Indented Art
  sector: inside
  desc: |2
       Two hand-drawn signs hang here. One is an extra description on the
    room; the other is the description of the exit north. Both begin with
    more leading whitespace than a later line carries, which is the shape
    that makes a YAML literal block decode back to a different string than
    it encoded unless an indentation indicator is emitted - and NestedText
    cannot reliably emit one at this depth, so it quotes instead.
  exits:
    north:
      to: 5007
      desc: "        /\\\n       /  \\    a gable, drawn in an exit description, six columns deep\n      /____\\   in the yaml document that comes out the other side\n"
      door: regular
      key: 5003
      keywords: gate grille
    south:
      to: 5005
      desc: |
            Back to the room with a hash in it.
      key: -1
  extra_descs:
  - keywords:
    - sign
    - painted
    desc: "        +----------------+\n        |  THIS WAY UP   |\n        +----------------+\n   and underneath, in a smaller hand, someone has added: 'or not'.\n"
- vnum: 5007
  name: The Room That Looks Like Syntax
  sector: inside
  desc: |2
       get_line skips a line whose first byte is '*'; fread_string does
    not. So the next line is content, and a loader that used the wrong
    primitive would silently lose it:
    * this line begins with an asterisk and is part of the description.
       The line after this one opens with the colour markup's own
    delimiter, which YAML would otherwise read as a flow mapping:
    {{red}}not colour, just two braces{{/}}
  exits:
    north:
      to: 5008
      desc: |
            North, to the last room.
      key: -1
    south:
      to: 5006
      desc: |
            Back to the gallery.
      key: -1
- vnum: 5008
  name: The Empty Room
  sector: inside
  desc: ""
  exits:
    south:
      to: 5007
      desc: |
            Back to the room that looks like syntax.
      key: -1
mobiles:
- vnum: 5000
  keywords:
  - everything
  - mobile
  - flags
  short: the mobile with every flag
  long: |
    A mobile carrying every action and affection bit at once stands here.
  desc: |2
       Both bit fields on this mobile are the full 32 the C can represent.
    Its hit dice and damage dice are at the extremes sscanf will read: the
    format embeds the 'd' and the '+' as literals, so a negative bonus
    cannot be written at all, and these are the largest that fit.
