schema: dl/world@1
zone:
  vnum: 1
  name: The Testing Grounds
  range:
  - 100
  - 3099
  lifespan: 20
  reset: always
rooms:
- vnum: 3001
  name: The Testing Grounds
  sector: inside
  flags:
  - indoors
  desc: |2
       Welcome to the Testing Grounds, a small tutorial built to walk a new
    character through the game one feature at a time. Nothing here can hurt
    you badly, nothing here is required, and everything here can be tried
    more than once - the whole zone resets itself regularly.
       To the north is the Hall of Movement, the first stop on the tour. Type
    'north' (or just 'n') to head that way, and 'look' at any time to see a
    room's description again.
  exits:
    north:
      to: 3002
      desc: |
            The tour continues north into the Hall of Movement.
      key: -1
- vnum: 3002
  name: Hall of Movement
  sector: inside
  flags:
  - indoors
  desc: |2
       This plain hall exists to teach the words you will use every time you
    play: 'north', 'south', 'east', 'west', 'up' and 'down' (or their short
    forms 'n', 's', 'e', 'w', 'u', 'd') move you between rooms; 'look' (or
    'l') shows you a room again; 'exits' lists which directions go anywhere
    at all; 'score' shows your own condition.
       A corridor leads south back to the start, and continues north toward
    the Door Room.
  exits:
    north:
      to: 3003
      desc: |
            Onward to the Door Room.
      key: -1
    south:
      to: 3001
      desc: |
            Back to the Testing Grounds.
      key: -1
- vnum: 3003
  name: The Door Room
  sector: inside
  flags:
  - indoors
  desc: |2
       A stout wooden door, closed for the moment, blocks the way north. This
    is where 'open door' and 'close door' are worth learning - a shut door
    stops you walking through it until you open it, the same as it would
    stop anyone else. There is a rusty-looking key on the floor here; you
    may want it before you go much further.
  exits:
    north:
      to: 3004
      desc: |
            A closed door blocks the way.
      door: regular
      key: -1
      keywords: door
    south:
      to: 3002
      desc: |
            Back toward the Hall of Movement.
      key: -1
- vnum: 3004
  name: The Locked Vault
  sector: inside
  flags:
  - indoors
  desc: |2
       Rather than a plain door, the one to the north is shut *and* locked.
    'unlock door with key' (with the rusty key from the room before this one
    in your inventory) undoes the lock, and 'open door' still has to be typed
    separately afterward - locking and opening are two different states. A
    thief could instead try 'pick door'.
  exits:
    north:
      to: 3005
      desc: |
            A locked door blocks the way.
      door: regular
      key: 149
      keywords: door
    south:
      to: 3003
      desc: |
            Back toward the Door Room.
      key: -1
- vnum: 3005
  name: The Armory
  sector: inside
  flags:
  - indoors
  desc: |2
       Racked along the walls is a small armory's worth of gear: a plain
    sword, a suit of leather, and a small brass lantern. 'get sword' (or
    'get all') picks something up, 'wear tunic' or 'wield sword' puts it to
    use, 'inventory' (or 'i') lists what you are carrying, and 'equipment'
    (or 'eq') lists what you have on. 'remove sword' and 'drop sword' undo
    both.
  exits:
    north:
      to: 3006
      desc: |
            Onward to the Cluttered Closet.
      key: -1
    south:
      to: 3004
      desc: |
            Back to the Locked Vault.
      key: -1
- vnum: 3006
  name: The Cluttered Closet
  sector: inside
  flags:
  - indoors
  desc: |2
       A leather bag lies open on the floor beside a small wooden chest.
    'put ring in bag' and 'get ring from bag' move things into and out of a
    container you are carrying; the chest works the same way once you 'open
    chest' first. 'examine bag' or 'examine chest' shows what is inside
    either one - plain 'look' only describes a container, it does not open
    it.
  exits:
    north:
      to: 3007
      desc: |
            Onward to the Dining Hall.
      key: -1
    south:
      to: 3005
      desc: |
            Back to the Armory.
      key: -1
- vnum: 3007
  name: The Dining Hall
  sector: inside
  flags:
  - indoors
  desc: |2
       A loaf of bread sits on the table, an empty waterskin hangs from a
    hook, and a stone fountain bubbles quietly in the corner. 'eat bread'
    takes care of hunger, 'fill waterskin from fountain' takes care of an
    empty skin, and 'drink waterskin' (or just 'drink fountain') takes care
    of thirst.
  exits:
    north:
      to: 3008
      desc: |
            Onward to the Sparring Ring.
      key: -1
    south:
      to: 3006
      desc: |
            Back to the Cluttered Closet.
      key: -1
- vnum: 3008
  name: The Sparring Ring
  sector: inside
  flags:
  - indoors
  desc: |2
       A straw-stuffed training dummy stands in the middle of the ring,
    patiently waiting to be hit. 'kill dummy' starts a fight - it barely
    fights back, so this is a safe place to see combat, a corpse, and
    'get all corpse' happen for the first time. If you know any skills or
    spells from a guild (the next room north teaches that), this is the
    place to 'kick dummy', 'cast 'magic missile' dummy', or similar. A small
    pile of loot sits against the wall: a scroll, a potion, a wand, a staff,
    and some gold coins - 'recite scroll', 'quaff potion', and 'use wand' (or
    'use staff') are worth trying on whatever is left of the dummy.
  exits:
    north:
      to: 3009
      desc: |
            Onward toward the Guildhall.
      key: -1
    south:
      to: 3007
      desc: |
            Back to the Dining Hall.
      key: -1
- vnum: 3009
  name: The Resting Room
  sector: inside
  flags:
  - indoors
  desc: |2
       A few plain cots line the walls. 'rest' sits you down and recovers
    hit points, mana and movement faster than standing around; 'sleep' does
    the same faster still, but you cannot see or fight while asleep; 'wake'
    and 'stand' bring you back up either way.
  exits:
    north:
      to: 3010
      desc: |
            Onward to the Guildhall.
      key: -1
    south:
      to: 3008
      desc: |
            Back to the Sparring Ring.
      key: -1
- vnum: 3010
  name: Outside the Guildhall
  sector: inside
  flags:
  - indoors
  desc: |2
       A guildmaster waits here, ready to teach anyone who asks. 'practice'
    on its own lists what you already know and what you could learn next;
    'practice <name>' spends practice sessions to improve it. This
    guildmaster teaches whatever your own class knows, not one fixed list -
    try it and see what it offers you.
  exits:
    north:
      to: 3011
      desc: |
            Onward to the General Store.
      key: -1
    south:
      to: 3009
      desc: |
            Back to the Resting Room.
      key: -1
- vnum: 3011
  name: The General Store
  sector: inside
  flags:
  - indoors
  desc: |2
       A shopkeeper stands behind a well-stocked counter. 'list' shows what
    is for sale and for how much; 'buy dagger' (or 'buy cloak') pays for it;
    'sell' offers something you are carrying back for a fraction of its
    price; 'value sword' asks what the shopkeeper would give for an item
    without actually selling it.
  exits:
    north:
      to: 3012
      desc: |
            Onward to the Bank.
      key: -1
    south:
      to: 3010
      desc: |
            Back to the Guildhall.
      key: -1
- vnum: 3012
  name: The Bank of Testing
  sector: inside
  flags:
  - indoors
  desc: |2
       An automatic teller machine is bolted to the wall - there is no
    teller here, just the machine itself, the same as the real game's own
    bank counters. 'balance' shows what you have on deposit; 'deposit 50'
    puts fifty coins in the bank, safe from anyone who might rob you;
    'withdraw 50' takes them back out again.
  exits:
    north:
      to: 3013
      desc: |
            Onward to the Travelers' Rest.
      key: -1
    south:
      to: 3011
      desc: |
            Back to the General Store.
      key: -1
- vnum: 3013
  name: The Travelers' Rest
  sector: inside
  flags:
  - indoors
  desc: |2
       A receptionist offers a place to stay. 'rent' explains the price of a
    room and, on this server, that there usually is not one - free_rent is
    turned on here, the same way it is on the real game, so 'rent' mostly
    just saves what you are carrying and lets you 'quit' without losing it.
    Logging back in picks up exactly where you left off.
  exits:
    north:
      to: 3014
      desc: |
            Onward to the Post Office.
      key: -1
    south:
      to: 3012
      desc: |
            Back to the Bank.
      key: -1
- vnum: 3014
  name: The Post Office
  sector: inside
  flags:
  - indoors
  desc: |2
       A postmaster sorts letters behind the counter. 'mail send Someone'
    starts a letter to another character (even yourself, to see how it
    works); 'check' asks whether anything has arrived; 'receive' collects
    it once it has.
  exits:
    north:
      to: 3015
      desc: |
            Onward to the Notice Board.
      key: -1
    south:
      to: 3013
      desc: |
            Back to the Post Office.
      key: -1
- vnum: 3015
  name: The Notice Board
  sector: inside
  flags:
  - indoors
  desc: |2
       A board is mounted on the wall, its cork covered in old pins.
    'look board' or 'read board' shows what has been posted; 'write board'
    opens an editor to post something of your own; 'remove board <number>'
    takes down a message you posted.
  exits:
    north:
      to: 3016
      desc: |
            On to the last room: Graduation Hall.
      key: -1
    south:
      to: 3014
      desc: |
            Back to the Post Office.
      key: -1
- vnum: 3016
  name: Graduation Hall
  sector: inside
  flags:
  - indoors
  desc: |2
       That is the whole tour. A few things had no room of their own because
    they need no room at all: 'smile', 'wave' and the rest of the socials
    work anywhere, on anyone; 'say hello' and 'tell someone hello' talk to
    whoever can hear you; 'group' and 'follow' need a second character to
    try with. 'help' lists everything this tutorial did not cover.
       The way back is south, all the way to the Testing Grounds - nothing
    here is one-way.
  exits:
    south:
      to: 3015
      desc: |
            Back the way you came.
      key: -1
