- vnum: 3155
  name: Inside The Chapel
  sector: inside
  flags:
  - dark
  - indoors
  desc: |2
       You are in a small, dark chapel.  The dark brown glass in the tiny windows
    do not let much light through.  A few rows of worn wooden benches stand here
    and an ancient altar sits in the middle of the floor.
  exits:
    north:
      to: 3154
      desc: |
            The chapel door is made of dark wood.
      door: regular
      key: -1
      keywords: door
  extra_descs:
  - keywords:
    - benches
    - rows
    desc: |
              The benches are not of the comfortable kind.
  - keywords:
    - altar
    desc: |
              The altar looks very old... you examine the floor around the altar and notice
              that it seems less dusty than the rest of the room... someone must clean here
              regularly... maybe that old guy in Park Cafe, he looked like that sort...
  - keywords:
    - glass
    - windows
    desc: |
              The windows must be meant to be dark.  At least they are completely clean.
