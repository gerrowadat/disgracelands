- vnum: 6100
  name: A Narrow Trail Through The Deep, Dark Forest
  sector: forest
  flags:
  - dark
  - indoors
  desc: |2
       You are on a narrow trail winding its way between the enormous, grey
    trunks.  The crowns of the trees must be very dense, as they leave the
    forest floor in utter darkness.  The trail leads east and west.
  exits:
    north:
      to: 6064
      desc: |
            A small shadowy path leads away to the north.
      key: -1
    east:
      to: 6004
      desc: |
            The narrow trail leads east to a somewhat lighter part of the forest.
      key: -1
    west:
      to: 6101
      desc: |
            The narrow, dusty trail leads west through the forest.
      key: -1
  extra_descs:
  - keywords:
    - tree
    - trees
    - trunk
    - trunks
    desc: |
              These ancient trees must have been here for many, many years.  It is impossible
              to catch even a glimpse of anything above the lowest branches.
  - keywords:
    - trail
    desc: |
              The dark and dusty trail seems fragile compared to the massive trunks, and in
              some places, giant grey roots have broken up through its surface.
