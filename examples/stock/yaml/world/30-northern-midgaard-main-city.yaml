  name: The Pet Shop
  sector: inside
  flags:
  - no_mob
  - indoors
  - no_magic
  desc: |2
       The Pet Shop is a small crowded store, full of cages and animals of
    various sizes.  There is a sign on the wall.
  exits:
    north:
      to: 3015
      desc: |
            You see the main street.
      key: -1
  extra_descs:
  - keywords:
    - sign
    desc: "The sign reads:\n\n  Use 'List' to see the available pets.\n  Use 'Buy <pet>' to buy yourself a pet.\n\n  Instructions for having pets:\n\n  You can use 'order <pet> <instructions>' to order your pets around.\n  If you abuse your pet, it will no longer regard you as its master.\n  If you have several pets you may use 'order followers <instructions>'\n\n  You can name the pet you buy with: 'buy <pet> <name>'\n\n Regards,\n\n The Shopkeeper\n\n"
