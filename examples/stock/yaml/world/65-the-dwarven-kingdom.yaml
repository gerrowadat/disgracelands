  name: Still On The Path To The Castle
  sector: inside
  flags:
  - indoors
  desc: |2
       You are still on the path to the castle, or back to the Dwarven
    village, whichever way you wish to go.  The path continues to the
    north and south.
  exits:
    north:
      to: 6512
      key: -1
    south:
      to: 6510
      key: -1
- vnum: 6512
  name: The Door To The Castle
  sector: inside
  flags:
  - indoors
  desc: "   Here there is a door to the castle to the east.  The castle is \nelegantly designed, and looks much like a roll of toilet paper\nstanding  on its end.  There is a sign which says:\n\n              ******************************************\n              *  WELCOME TO THE CASTLE OF STRANGELOVE  *\n              *      Here, celibacy is uninvited       *\n              ******************************************\n\n"
  exits:
    east:
      to: 6525
      door: pickproof
      key: 6503
      keywords: door
    south:
      to: 6511
      key: -1
- vnum: 6513
  name: Inside The Entrance
  sector: inside
  flags:
  - indoors
  desc: |2
       Everything here is covered in soot and very grimy.  The path continues
    to the east and north, and there is a door to the west.
  exits:
    north:
      to: 6514
      desc: |
            The little underground path continues to the north.
      key: -1
    east:
      to: 6505
      desc: |
            The path leads outside the entrance.
      door: pickproof
      key: 6515
      keywords: door
    west:
      to: 6526
      desc: |
            This looks like an entrance to some type of store room.
      key: -1
