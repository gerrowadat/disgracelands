  - indoors
  desc: |2
       The stairs continue to circle up and down here.
  exits:
    up:
      to: 6529
      key: -1
    down:
      to: 6525
      key: -1
- vnum: 6529
  name: On The Stairs
  sector: inside
  flags:
  - indoors
  desc: |2
       You are still circling around on the stairs.  You are starting to
    get dizzy from going around and around and around and around and
    around.  The stairs continue up and down.
  exits:
    up:
      to: 6530
      key: -1
    down:
      to: 6528
      key: -1
- vnum: 6530
  name: At The Top Of The Stairs
  sector: inside
  flags:
  - indoors
  desc: |2
       You are at the top of the stairs in the castle.  There is an exit
    to the east, and the stairs lead down.
  exits:
    east:
      to: 6531
      key: -1
    down:
      to: 6529
      key: -1
- vnum: 6531
  name: The Queen's Waiting Room
  sector: inside
  flags:
  - indoors
  desc: |2
       This is the Queen's waiting room.  Here the men literally
    'wait' for the queen.  You've heard that the queen really
    likes to get to 'know' her people, in the biblical sense.
       The Queen's bedroom is to the north, and you can see stairs
    to the west.
  exits:
    north:
      to: 6532
      door: regular
      key: -1
      keywords: door
    west:
      to: 6530
      key: -1
- vnum: 6532
  name: The Queen's Bedroom
  sector: inside
  flags:
  - indoors
  desc: "   This is the Queen's bedroom.  The bed is all ruffled, and there\nis a stack of dirty sheets piled in the corner.  There is a ladder\nthat leads down, out of the castle, and you can leave the room\nto the south.  There is also a small wooden door to the west.\nThere is a sign that says:\n\n      -------------------------\n      |  I'm busy right now,  |\n      |  and don't know when  |\n      |  Ill be back, but if  |\n      |  there is a key here  |\n      |  take it and PLEASE,  |\n      |  try to get my birth  |\n      |  control pills back!  |\n      |  I've heard they can  |\n      |  be found somewhere,  |\n      |  deep in the mines..  |\n      -------------------------\n\n"
  exits:
    south:
      to: 6531
      door: regular
      key: -1
      keywords: door
    west:
      to: 6554
      door: pickproof
      key: 6500
      keywords: door wooden
    down:
      to: 6533
      key: -1
- vnum: 6533
  name: The North Side Of Castle Strangelove
  sector: inside
  desc: |2
       You are standing on the north side of Castle Strangelove.  You
    notice that you are no longer inside the mountain anymore either.
    Along the southern horizon you see towering mountains.
       The only exit, however, is back up the ladder into the Queen's
    Bedroom.
  exits:
    up:
      to: 6532
      key: -1
- vnum: 6534
  name: The Hospital
  sector: inside
  flags:
  - indoors
  desc: |2
       You are inside the Dwarven Hospital.  It smells like rubbing
    alcohol, and there is blood all over the walls.
  exits:
    south:
      to: 6519
      key: -1
