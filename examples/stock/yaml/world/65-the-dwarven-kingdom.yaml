  exits:
    north:
      to: 6544
      key: -1
- vnum: 6552
  name: The End Of The Maze
  sector: inside
  flags:
  - dark
  - indoors
  desc: "   You have solved the maze.  You can tell by the last few moves\nthat there is no way that a dumb worker could have figured that\nout.  It seems pretty desolate here.  To the south is a bleak\nroom.  To the north, you see the maze.  There is a sign above\nthe south exit:\n\nTHOSE WHO ENTER, PLAN ON A TIMELY DEATH.\n(ESPECIALLY IF YOU'RE LOYAL TO THE QUEEN)\n\n"
