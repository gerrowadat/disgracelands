    west:
      to: 6520
      key: -1
- vnum: 6522
  name: A Guard House
  sector: inside
  flags:
  - indoors
  desc: |2
       You are in the guard house to the west of the entrance to the castle.  
    There are nudie posters covering the walls.
  exits:
    east:
      to: 6509
      key: -1
  extra_descs:
  - keywords:
    - poster
