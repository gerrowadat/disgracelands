    door, and to the south the path continues.
  exits:
    north:
      to: 6509
      key: -1
    south:
      to: 6507
      key: -1
- vnum: 6509
  name: The Door To The Kingdom
  sector: inside
  flags:
  - indoors
  desc: |2
       Here the path turns to the west.  You can see a door in front of you,
    and the path continues to the west and south.
  exits:
    north:
      to: 6510
      door: pickproof
      key: 6503
      keywords: door
    south:
      to: 6508
      key: -1
    west:
      to: 6522
      key: -1
- vnum: 6510
  name: On The Path To The Castle
  sector: inside
  flags:
  - indoors
  desc: |2
       You are on a path that will eventually lead to the castle.  It
    continues north to the castle, and there is a door in the southern
    wall.
  exits:
    north:
      to: 6511
      key: -1
    south:
      to: 6509
      door: pickproof
      key: 6503
      keywords: door
