      key: -1
- vnum: 7215
  name: The Half-Wet Drain
  sector: hills
  flags:
  - dark
  - indoors
  desc: |2
       You are in a sewer drain where the floor is covered with water.  To
    the north it looks more dry, south however the drain runs down into
    some water.
  exits:
    north:
      to: 7210
      desc: |
            To the north lies a dry four-way junction.
      key: -1
    south:
      to: 7216
      desc: |
            To the south you see a sewer drain filled with water.
      key: -1
  extra_descs:
  - keywords:
    - water
    desc: |
              The water is dirty but it looks like you would be able to swim in it.
- vnum: 7216
  name: Under Water In The Sewer
  sector: water_swim
  flags:
  - dark
  - indoors
  desc: |2
       You are swimming in some dirty water and are holding your breath.  You'd
    better continue onwards before you drown.  It is a good thing that you can
    hold your light above the water-level.
  exits:
    north:
      to: 7215
      desc: |
            It is hard to see, but it looks like the drain runs slightly upwards.
      key: -1
    south:
      to: 7217
      desc: |
            It is hard to see, but it looks like the drain runs a little bit upwards.
      key: -1
