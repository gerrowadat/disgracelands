  min_victim_position: dead
  no_arg:
    char: Who do you want to throw a snowball at??
  found:
    char: You throw a snowball in $N's face.
    others: $n conjures a snowball from thin air and throws it at $N.
    victim: $n conjures a snowball from thin air and throws it at you.
  not_found: You stand with the snowball in your hand because your victim is not here.
  self:
    char: You conjure a snowball from thin air and throw it at yourself.
    others: $n conjures a snowball out of the thin air and throws it at $mself.
