# Disgracelands game-tuning config, for --config (or DL_CONFIG).
#
# This is the subset of reference/moderncserver/src/config.c that this port
# makes a runtime setting rather than an archive fact — see
# docs/deviations.md for which fields these are and why the rest of
# config.c is deliberately not here.
#
# Every value below is commented out and set to config.c's own default:
# an empty file, or no --config at all, reproduces the archive's behaviour
# exactly. Uncomment and change only what you mean to change.
#
# The running server rereads this file on SIGHUP and applies it live — no
# restart needed. A file that fails to parse or fails validation is logged
# and ignored; the server keeps running on whatever it had before.

# free_rent (config.c:133): whether renting is free. On the archive this was
# always true, so nobody ever paid — the receptionist just says so and stops.
# Turning it off makes the priced path (below) reachable.
# free_rent: true

# min_rent_cost (config.c:139): the receptionist's own fee, added to the
# priced items. Only matters if free_rent is false.
# min_rent_cost: 100

# max_obj_save (config.c:136): the most items a rent file will hold.
# max_obj_save: 30

# auto_save (config.c:150): whether the periodic save sweep runs at all.
# auto_save: true

# autosave_time (config.c:157), in minutes: how often auto_save actually
# saves everyone. Checked once per PULSE_AUTOSAVE (60s) tick, so this is in
# units of "roughly a minute", same as the C.
# autosave_time: 5

# max_npc_corpse_time / max_pc_corpse_time (config.c:76), in mud hours: how
# long a mobile's or a player's corpse lasts before it rots away.
# max_npc_corpse_time: 5
# max_pc_corpse_time: 10

# level_can_shout (config.c:61): the minimum level to shout, gossip, auction
# or holler.
# level_can_shout: 1

# holler_move_cost (config.c:64): movement points a holler costs, however
# loud you are. Shouting, gossiping and auctioning are always free.
# holler_move_cost: 20

# max_filesize (config.c:233), in bytes: bug/idea/typo reports refuse to
# append once their file reaches this size.
# max_filesize: 50000
